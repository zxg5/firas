<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#grad)"/>
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Arabic Calligraphic Letter 'و' (Waw) for WAFA -->
  <g filter="url(#shadow)" fill="#ffffff" transform="translate(10, 0)">
    <text 
      x="256" 
      y="350" 
      font-family="'Cairo', 'Arial', sans-serif" 
      font-size="280" 
      font-weight="900" 
      text-anchor="middle" 
      fill="#ffffff"
    >و</text>
  </g>
  
  <!-- Subtle Loyalty / Star Emblem -->
  <circle cx="360" cy="140" r="28" fill="#fbbf24"/>
  <path d="M 360 122 L 365 134 L 377 134 L 367 142 L 371 154 L 360 146 L 349 154 L 353 142 L 343 134 L 355 134 Z" fill="#78350f"/>
</svg>
